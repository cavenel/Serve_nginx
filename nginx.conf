# nginx configuration for a static data server on SciLifeLab Serve.
#
# - Runs as a non-root user (UID 1000): all writable paths point to /tmp.
# - Serves files from /home/serve/data with HTTP Range support (nginx does
#   this for static files out of the box: 206, Accept-Ranges, Content-Range).
# - Allows cross-origin requests from any origin, including the preflight
#   that browsers send when a viewer asks for a byte range.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root: temp paths must be writable by UID 1000.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Serve logs are for debugging only and must not track users.
    access_log    off;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Range requests are not honoured on gzipped responses, so keep gzip off.
    gzip          off;

    server {
        listen 8080;
        server_name _;
        root /home/serve/data;

        # Used by the GitHub Actions smoke test and by Docker HEALTHCHECK.
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            # Directory listings. Remove this line to hide the file tree.
            autoindex on;

            add_header Access-Control-Allow-Origin   "*" always;
            add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers  "Range, If-None-Match, If-Modified-Since, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Last-Modified" always;
            add_header Access-Control-Max-Age        86400 always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            try_files $uri $uri/ =404;
        }
    }
}
