# nginx configuration for a static data server on SciLifeLab Serve.
#
# - Runs as a non-root user (UID 1000): all writable paths point to /tmp.
# - Serves files from /home/data with HTTP Range support (nginx does
#   this for static files out of the box: 206, Accept-Ranges, Content-Range).
# - Allows cross-origin requests from any origin, including the preflight
#   that browsers send when a viewer asks for a byte range.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root: temp paths must be writable by UID 1000.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Serve logs are for debugging only and must not track users.
    access_log    off;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Range requests are not honoured on gzipped responses, so keep gzip off.
    gzip          off;

    server {
        listen 8080;
        server_name _;
        root /home/data;

        # CORS headers on every response, including errors. Set at server level
        # so every location below inherits them (none of them uses add_header).
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Range, If-None-Match, If-Modified-Since, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Last-Modified" always;
        add_header Access-Control-Max-Age        86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Used by the GitHub Actions smoke test and by Docker HEALTHCHECK.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Zarr v2 metadata keys (.zattrs, .zarray, .zgroup, .zmetadata).
        #
        # zarrita treats a 404 on these keys as "missing" and uses that to pick
        # the format (v2 or v3), the node kind (array or group) and empty
        # attributes. Serve's gateway replaces every upstream 404 with its own
        # page without CORS headers, so the browser reports a network error.
        #
        # When a key is missing inside a Zarr node (a directory holding
        # .zarray, .zgroup or zarr.json), answer 200 with what zarrita would
        # conclude from a 404, in a form that passes the gateway:
        # - .zattrs in a v2 node: "{}". v2 attributes are optional and a
        #   missing .zattrs means empty attributes.
        # - anything else: a plain-text body. zarrita fails to parse it as
        #   JSON and moves on (v2 array to v2 group, v2 to v3, consolidated
        #   to plain metadata), as it does on a 404.
        # Outside a Zarr node, missing keys answer 410 like any other file.
        #
        # The if blocks only set variables or return: existing files are still
        # served as static files.
        location ~ ^(?<zarr_dir>.*/)(?<zarr_key>\.(?:zattrs|zarray|zgroup|zmetadata))$ {
            set $zarr_node "";
            if (-f $document_root${zarr_dir}zarr.json) {
                set $zarr_node "v3";
            }
            if (-f $document_root${zarr_dir}.zgroup) {
                set $zarr_node "v2";
            }
            if (-f $document_root${zarr_dir}.zarray) {
                set $zarr_node "v2";
            }
            if (-f $request_filename) {
                set $zarr_node "";
            }
            set $zarr_missing "${zarr_node}${zarr_key}";
            if ($zarr_missing = "v2.zattrs") {
                return 200 "{}\n";
            }
            if ($zarr_node) {
                return 200 "not found: no such Zarr v2 metadata key\n";
            }
            try_files $uri =410;
        }

        location / {
            # Directory listings. Remove this line to hide the file tree.
            autoindex on;

            # Missing files answer 410 Gone, not 404: Serve's gateway would
            # replace a 404 with a page without CORS headers (see above).
            try_files $uri $uri/ =410;
        }
    }
}
