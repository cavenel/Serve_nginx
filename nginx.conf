# nginx configuration for a static data server on SciLifeLab Serve.
#
# - Runs as a non-root user (UID 1000): all writable paths point to /tmp.
# - Serves files from /home/data with HTTP Range support (nginx does
#   this for static files out of the box: 206, Accept-Ranges, Content-Range).
# - Allows cross-origin requests from any origin, including the preflight
#   that browsers send when a viewer asks for a byte range.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root: temp paths must be writable by UID 1000.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Serve logs are for debugging only and must not track users.
    access_log    off;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Range requests are not honoured on gzipped responses, so keep gzip off.
    gzip          off;

    server {
        listen 8080;
        server_name _;
        root /home/data;

        # CORS headers on every response, including errors. Set at server level
        # so every location below inherits them (none of them uses add_header).
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Range, If-None-Match, If-Modified-Since, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Last-Modified" always;
        add_header Access-Control-Max-Age        86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Used by the GitHub Actions smoke test and by Docker HEALTHCHECK.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Zarr v2 metadata keys (.zattrs, .zarray, .zgroup, .zmetadata).
        #
        # zarrita's auto-detecting open() probes v2 first and only falls back to
        # v3 on a 404 or on metadata that is not valid JSON. Serve's gateway
        # replaces every upstream 404 with its own page without CORS headers,
        # so the browser reports a network error and zarrita gives up.
        #
        # When such a key is missing but the same directory holds a zarr.json,
        # the directory is a Zarr v3 node and the v2 key can never exist. Answer
        # 200 with a plain-text body: it passes the gateway with CORS headers,
        # zarrita fails to parse it as JSON and moves on to zarr.json.
        location ~ ^(?<zarr_dir>.*/)\.(?:zattrs|zarray|zgroup|zmetadata)$ {
            set $zarr_v3_only "";
            if (-f $document_root${zarr_dir}zarr.json) {
                set $zarr_v3_only "1";
            }
            if (-f $request_filename) {
                set $zarr_v3_only "";
            }
            if ($zarr_v3_only) {
                return 200 "not found: Zarr v3 node, no v2 metadata\n";
            }
            try_files $uri =410;
        }

        location / {
            # Directory listings. Remove this line to hide the file tree.
            autoindex on;

            # Missing files answer 410 Gone, not 404: Serve's gateway would
            # replace a 404 with a page without CORS headers (see above).
            try_files $uri $uri/ =410;
        }
    }
}
